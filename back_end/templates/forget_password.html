<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - DiaBalance</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f4f6f9; /* พื้นหลังสีสว่างสบายตา */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .card-forgot { 
            background-color: #385A8C; /* พื้นหลังการ์ดสีน้ำเงินเข้มเหมือนหน้า Login */
            color: white; /* เปลี่ยนตัวหนังสือเป็นสีขาว */
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 450px; 
        }

        .icon-header {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: white;
        }

        .form-control { 
            border-radius: 25px; /* ทำช่องกรอกให้โค้งมนเหมือนหน้า Login */
            padding: 12px 20px; 
            border: none;
        }
        
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(139, 164, 235, 0.5);
        }

        .btn-custom { 
            background-color: #8BA4EB; /* สีปุ่มฟ้าอ่อน */
            color: white; 
            border-radius: 25px; 
            padding: 12px; 
            font-weight: 600; 
            width: 100%; 
            transition: 0.3s; 
            border: none;
            margin-top: 10px;
        }

        .btn-custom:hover:not(:disabled) { 
            background-color: #7792e3; 
            color: white;
            transform: translateY(-2px);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #385A8C;
            font-size: 1.2rem;
        }

        .form-control-with-icon {
            padding-left: 45px; /* เว้นที่ให้ไอคอน */
        }
    </style>
</head>
<body>

    <div class="card-forgot text-center">
        <i class="bi bi-shield-lock-fill icon-header"></i>
        <h3 class="fw-bold mb-2">ลืมรหัสผ่าน</h3>
        <p class="mb-4 text-light" style="font-size: 0.9rem; opacity: 0.9;" id="stepDescription">กรุณากรอกชื่อผู้ใช้งาน (Username) เพื่อขอรับรหัส OTP</p>

        <form id="requestOtpForm" onsubmit="handleRequestOTP(event)">
            <div class="mb-3 text-start input-icon-wrapper">
                <i class="bi bi-person-fill input-icon"></i>
                <input type="text" class="form-control form-control-with-icon" id="forgotUsername" placeholder="ชื่อผู้ใช้งาน (Username)" required>
            </div>
            
            <button type="submit" class="btn btn-custom" id="btnRequest">ขอรหัส OTP</button>
            
            <div class="mt-4">
                <span style="font-size: 0.85rem; opacity: 0.8;">กลับไปหน้า <a href="/login" class="text-white fw-bold text-decoration-underline" style="opacity: 1;">เข้าสู่ระบบ</a></span>
            </div>
        </form>

        <form id="resetPasswordForm" onsubmit="handleResetPassword(event)" style="display: none;">
            <div class="mb-3 text-start input-icon-wrapper">
                <i class="bi bi-chat-left-dots-fill input-icon"></i>
                <input type="text" class="form-control form-control-with-icon text-center fw-bold fs-5" style="padding-left: 20px; letter-spacing: 5px;" id="otpCode" placeholder="รหัส OTP 6 หลัก" maxlength="6" required>
            </div>
            <div class="mb-3 text-start input-icon-wrapper">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password" class="form-control form-control-with-icon" id="newPassword" placeholder="รหัสผ่านใหม่" required>
            </div>
            <div class="mb-4 text-start input-icon-wrapper">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password" class="form-control form-control-with-icon" id="confirmNewPassword" placeholder="ยืนยันรหัสผ่านใหม่" required>
            </div>
            <button type="submit" class="btn btn-custom" id="btnReset">รีเซ็ตรหัสผ่าน</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // 1. ฟังก์ชันขอรหัส OTP
        async function handleRequestOTP(event) {
            event.preventDefault();
            const username = document.getElementById('forgotUsername').value.trim();
            const btnRequest = document.getElementById('btnRequest');
            
            btnRequest.disabled = true;

            Swal.fire({ title: 'กำลังค้นหาและส่ง OTP...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch('/api/forgot_password_request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await res.json();

                Swal.close();

                if (res.ok) {
                    // เปลี่ยน UI ไปสเต็ป 2
                    document.getElementById('requestOtpForm').style.display = 'none';
                    document.getElementById('resetPasswordForm').style.display = 'block';
                    document.getElementById('stepDescription').innerHTML = `เราได้ส่ง OTP ไปที่ <br><b>${data.masked_email}</b> แล้ว`;
                    
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'success',
                        title: 'ส่ง OTP สำเร็จ',
                        showConfirmButton: false,
                        timer: 3000
                    });
                } else {
                    Swal.fire('ข้อผิดพลาด', data.error || 'ไม่สามารถทำรายการได้', 'error');
                    btnRequest.disabled = false;
                }
            } catch (error) {
                Swal.fire('ระบบขัดข้อง', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                btnRequest.disabled = false;
            }
        }

        // 2. ฟังก์ชันรีเซ็ตรหัสผ่าน
        async function handleResetPassword(event) {
            event.preventDefault();
            const otp = document.getElementById('otpCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                return Swal.fire('ข้อผิดพลาด', 'รหัสผ่านใหม่ไม่ตรงกัน', 'warning');
            }
            if (newPassword.length < 6) {
                return Swal.fire('ข้อผิดพลาด', 'รหัสผ่านต้องมี 6 ตัวอักษรขึ้นไป', 'warning');
            }

            const btnReset = document.getElementById('btnReset');
            btnReset.disabled = true;

            Swal.fire({ title: 'กำลังรีเซ็ตรหัสผ่าน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch('/api/forgot_password_reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp: otp, new_password: newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    Swal.fire({
                        title: 'สำเร็จ!',
                        text: 'รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว',
                        icon: 'success',
                        confirmButtonColor: '#8BA4EB'
                    }).then(() => {
                        window.location.href = '/login'; 
                    });
                } else {
                    Swal.fire('ข้อผิดพลาด', data.error || 'ไม่สามารถรีเซ็ตได้', 'error');
                    btnReset.disabled = false;
                }
            } catch (error) {
                Swal.fire('ระบบขัดข้อง', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                btnReset.disabled = false;
            }
        }
    </script>
</body>
</html>
