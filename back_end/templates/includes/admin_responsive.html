{# Shared admin layout, loaded after page-specific styles. #}
<style>
  body.admin-page { background: #fff; min-height: 100vh; }
  /* Action colours are shared; never inherit the sidebar's theme variables. */
  .admin-page .action-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    min-width: max-content;
  }
  .admin-page :is(.btn-edit, .btn-delete, .rule-delete) {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    gap: 6px;
    width: auto;
    min-width: 76px;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid;
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    word-break: normal;
    overflow-wrap: normal;
    line-height: 1.4;
    cursor: pointer;
  }
  .admin-page :is(.btn-edit, .btn-delete, .rule-delete) i { flex-shrink: 0; }
  .admin-page .btn-edit { color: #b45309; background: #fffbeb; border-color: #fde68a; }
  .admin-page .btn-edit:hover { color: #fff; background: #b45309; border-color: #b45309; }
  .admin-page :is(.btn-delete, .rule-delete) { color: #c53030; background: #fff5f5; border-color: #fed7d7; }
  .admin-page :is(.btn-delete, .rule-delete):hover { color: #fff; background: #c53030; border-color: #c53030; }
  .admin-page .rule-delete span { display: inline; }
  .admin-page :is(.btn-add-exercise, .btn-add-category, .btn-add-freq, .btn-add-avoid, .btn-add-patient-warning, .rules-add, .btn-save) {
    background: #2b5cb3;
    color: #fff;
    border: 1px solid #2b5cb3;
    border-radius: 8px;
    min-height: 44px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .admin-page :is(.btn-add-exercise, .btn-add-category, .btn-add-freq, .btn-add-avoid, .btn-add-patient-warning, .rules-add, .btn-save):hover {
    background: #1e458a; border-color: #1e458a; color: #fff;
  }
  .admin-page :is(.btn-edit, .btn-delete, .rule-delete, .rules-add):focus-visible {
    outline: 3px solid #81b3ff; outline-offset: 3px;
  }
  .admin-page .admin-layout,
  .admin-page .main-content,
  .admin-page .rules-page { min-width: 0; max-width: 100%; }
  .admin-page .main-content { width: 100%; }
  .admin-page .table-card { max-width: 100%; overflow-x: auto; }
  .admin-page .table-card table { min-width: 640px; width: 100%; }
  .admin-page .table-card th,
  .admin-page .table-card td { overflow-wrap: anywhere; }
  .admin-page :is(.exercise-table, .freq-table, .warning-table, .avoid-table, .user-table) :is(th, td):first-child {
    white-space: nowrap;
    overflow-wrap: normal;
    word-break: normal;
    width: 1%;
  }
  .admin-page .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .admin-page .stat-card,
  .admin-page .activity-left { min-width: 0; }
  .admin-page .activity-text { min-width: 0; overflow-wrap: anywhere; }
  .admin-page .toolbar-section { flex-wrap: wrap; }
  .admin-page .search-wrapper { min-width: 180px; flex: 1 1 220px; }
  .admin-page .swal2-popup { max-width: calc(100vw - 32px); }
  @media (min-width: 769px) and (max-width: 1100px) {
    .admin-page .main-content, .admin-page .rules-page { padding: 28px 24px; }
    .admin-page .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .admin-page .stat-card { padding: 18px; gap: 12px; }
  }
  @media (max-width: 768px) {
    body.admin-page { margin-left: 0; }
    .admin-page .main-content,
    .admin-page .rules-page,
    .admin-page main { width: 100%; padding: 80px 16px 32px; }
    .admin-page .sidebar { width: min(260px, calc(100vw - 72px)); }
    .admin-page .sidebar-toggle { z-index: 1001; }
    .admin-page.admin-menu-open .sidebar-toggle { left: auto; right: 16px; }
    .admin-page.admin-menu-open { overflow: hidden; }
    .admin-page .header-section,
    .admin-page .rules-header { flex-direction: column; align-items: stretch; gap: 16px; }
    .admin-page .header-section h1,
    .admin-page .welcome-header h1,
    .admin-page .rules-header h1,
    .admin-page main h1 { font-size: 24px !important; overflow-wrap: anywhere; }
    .admin-page .toolbar-section { flex-direction: column; align-items: stretch; gap: 12px; }
    .admin-page .search-wrapper { flex: auto; min-width: 0; width: 100%; }
    .admin-page .filter-select { min-width: 0; width: 100%; max-width: 100%; }
    .admin-page .stat-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .admin-page .stat-card { padding: 18px; gap: 16px; }
    .admin-page .stat-icon { flex-shrink: 0; }
    .admin-page .table-card { padding: 12px; }
    .admin-page .table-card th, .admin-page .table-card td { padding: 12px; }
    .admin-page .activity-card { padding: 16px; }
    .admin-page .activity-item { flex-wrap: wrap; gap: 12px; }
    .admin-page .activity-left { flex: 1 1 200px; }
    .admin-page input:not([type="checkbox"]):not([type="radio"]),
    .admin-page select, .admin-page textarea { font-size: 16px; max-width: 100%; }
    .admin-page button:not(.swal2-close),
    .admin-page .rules-add, .admin-page select { min-height: 44px; }
    .admin-page .rules-search button { top: 0; min-width: 36px; }
    .admin-page .rules-list-caption { flex-wrap: wrap; }
    .admin-page .rule-delete { min-width: 44px; }
    .admin-page .settings-card { padding: 20px 16px; }
    .admin-page .settings-card > .d-flex { flex-wrap: wrap; gap: 12px; }
    .admin-page .admin-settings-breadcrumb { padding: 80px 16px 0; }
    .admin-page .admin-settings-breadcrumb + .header-section { padding: 24px 0; margin-bottom: 24px; }
    .admin-page .layout { grid-template-columns: minmax(0, 1fr); }
    .admin-page .layout > * { min-width: 0; }
  }
</style>
{% if not admin_styles_only|default(false) %}
<script>
  document.querySelectorAll('.admin-page .table-card').forEach(card => {
    card.tabIndex = 0;
    card.setAttribute('role', 'region');
    card.setAttribute('aria-label', 'ตารางข้อมูล เลื่อนซ้ายขวาเพื่อดูข้อมูลทั้งหมด');
  });
</script>

{% endif %}
