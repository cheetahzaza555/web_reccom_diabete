<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Expert System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; padding-bottom: 50px; }
        .header-section { background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; padding: 40px 0; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-label { font-weight: 600; color: #555; font-size: 0.9rem; }
        .section-title { border-bottom: 2px solid #e9ecef; padding-bottom: 8px; margin-bottom: 15px; color: #4ca1af; font-weight: bold; }
        .btn-analyze { width: 100%; font-weight: bold; padding: 12px; border-radius: 8px; }
        
        .result-box { padding: 15px; border-radius: 10px; height: 100%; border-left: 5px solid gray; background: #fff; }
        .res-warn { border-left-color: #dc3545; background-color: #fff5f5; }
        .res-exercise { border-left-color: #198754; background-color: #e8f5e9; }
        .res-comorb { border-left-color: #0d6efd; background-color: #e3f2fd; }
        .res-compli { border-left-color: #fd7e14; background-color: #fff8e1; }
        .list-group-item { border: none; background: transparent; padding: 5px 0; }
        
        .profile-table th { background-color: #f8f9fa; width: 40%; font-size: 0.9rem; color: #666; }
        .profile-table td { font-size: 0.95rem; font-weight: 600; color: #333; }
    </style>
</head>
<body>

    <div class="header-section text-center">
        <div class="container">
            <h1 class="fw-bold"><i class="bi bi-robot"></i> ระบบผู้เชี่ยวชาญเบาหวาน</h1>
            <p class="mb-0">Semantic Web Expert System</p>
        </div>
    </div>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 text-primary"><i class="bi bi-file-earmark-medical"></i> บันทึกข้อมูลผู้ป่วย</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12"><div class="section-title">ข้อมูลทั่วไป</div></div>
                            <div class="col-md-4">
                                <label class="form-label">ID ผู้ป่วย</label>
                                <input type="number" id="pid" class="form-control" placeholder="101">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">ชนิดเบาหวาน</label>
                                <select id="dtype" class="form-select">
                                    <option value="T2DM">Type 2</option>
                                    <option value="T1DM">Type 1</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">BMI</label>
                                <input type="number" step="0.1" id="bmi" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ชื่อ</label>
                                <input type="text" id="fname" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">นามสกุล</label>
                                <input type="text" id="lname" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">SBP (บน)</label>
                                <input type="number" id="sbp" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">DBP (ล่าง)</label>
                                <input type="number" id="dbp" class="form-control">
                            </div>

                            <div class="col-12 mt-4"><div class="section-title">ผล Lab</div></div>
                            <div class="col-md-6">
                                <label class="form-label">FPG</label>
                                <input type="number" id="fpg" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cholesterol</label>
                                <input type="number" id="chol" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">LDL</label>
                                <input type="number" id="ldl" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">HDL</label>
                                <input type="number" id="hdl" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Triglyceride</label>
                                <input type="number" id="tri" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ketone</label>
                                <select id="ketone" class="form-select">
                                    <option value="Negative">Negative</option>
                                    <option value="Positive">Positive</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Microalbuminuria</label>
                                <select id="micro" class="form-select">
                                    <option value="Negative">Negative</option>
                                    <option value="Positive">Positive</option>
                                </select>
                            </div>

                            <div class="col-12 mt-4"><div class="section-title">ภาวะแทรกซ้อนพิเศษ</div></div>
                            <div class="col-12">
                                <div class="bg-light p-3 rounded border">
                                    <div class="row g-2">
                                        <div class="col-md-6">
                                            <div class="form-check">
                                                <input class="form-check-input special-check" type="checkbox" value="AutonomicNeuropathy" id="sc1">
                                                <label class="form-check-label" for="sc1">Autonomic Neuropathy</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input special-check" type="checkbox" value="HeartDisease" id="sc2">
                                                <label class="form-check-label" for="sc2">Heart Disease</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-check">
                                                <input class="form-check-input special-check" type="checkbox" value="Retinopathy" id="sc3">
                                                <label class="form-check-label" for="sc3">Retinopathy</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input special-check" type="checkbox" value="PeripheralNeuropathy" id="sc4">
                                                <label class="form-check-label" for="sc4">Peripheral Neuropathy</label>
                                            </div>
                                        </div>
                                    </div>
                                    <small class="text-muted mt-2 d-block">* หากไม่มีให้เว้นว่างไว้ ระบบจะระบุเป็น NoOtherComplication อัตโนมัติ</small>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn btn-success btn-analyze shadow-sm" onclick="analyzeData()">
                                    <i class="bi bi-rocket-takeoff"></i> ประมวลผล
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card mb-4">
                    <div class="card-body">
                        <label class="form-label fw-bold"><i class="bi bi-search"></i> ค้นหาผู้ป่วยเก่า</label>
                        <div class="input-group">
                            <input type="text" id="search_id" class="form-control" placeholder="ID...">
                            <button class="btn btn-primary" onclick="searchPatient()">ค้นหา</button>
                        </div>
                    </div>
                </div>

                <div id="result" class="d-none">
                    <div class="card mb-3 border-info">
                        <div class="card-header bg-info text-white">
                            <h6 class="mb-0"><i class="bi bi-person-vcard"></i> ข้อมูลผู้ป่วย</h6>
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-striped mb-0 profile-table">
                                <tbody id="profileTableBody"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12">
                            <div class="result-box res-warn">
                                <h6 class="text-danger fw-bold">คำเตือน</h6>
                                <ul id="warnList" class="list-group list-group-flush small"></ul>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="result-box res-exercise">
                                <h6 class="text-success fw-bold">แนะนำออกกำลังกาย</h6>
                                <ul id="exList" class="list-group list-group-flush small"></ul>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="result-box res-comorb">
                                <h6 class="text-primary fw-bold">โรคร่วม</h6>
                                <ul id="comorbList" class="list-group list-group-flush small"></ul>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="result-box res-compli">
                                <h6 class="text-warning fw-bold" style="color:#fd7e14">ภาวะแทรกซ้อน</h6>
                                <ul id="compliList" class="list-group list-group-flush small"></ul>
                            </div>
                        </div>
                    </div>

                    <div class="card mt-3 bg-light">
                        <div class="card-body d-flex justify-content-between">
                            <button class="btn btn-warning btn-sm" onclick="reprocessPatient()">รันกฎใหม่</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePatient()">ลบข้อมูล</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function analyzeData() {
            // ✅ 1. ดึงค่า Checkbox ทั้งหมดที่ติ๊ก
            const selectedComplications = [];
            document.querySelectorAll('.special-check:checked').forEach(cb => {
                selectedComplications.push(cb.value);
            });

            const data = {
                id: document.getElementById('pid').value,
                type: document.getElementById('dtype').value,
                firstname: document.getElementById('fname').value,
                lastname: document.getElementById('lname').value,
                bmi: document.getElementById('bmi').value,
                sbp: document.getElementById('sbp').value,
                dbp: document.getElementById('dbp').value,
                chol: document.getElementById('chol').value,
                ldl: document.getElementById('ldl').value,
                hdl: document.getElementById('hdl').value,
                tri: document.getElementById('tri').value,
                fpg: document.getElementById('fpg').value,
                ketone: document.getElementById('ketone').value,
                micro: document.getElementById('micro').value,
                // ✅ 2. ส่ง Array ไปแทนค่าเดี่ยว
                complications: selectedComplications
            };

            if(!data.id) return alert("ระบุ ID ก่อน");

            try {
                const res = await fetch('/api/analyze', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                const json = await res.json();
                if(json.status === 'ok') {
                    alert("บันทึกและประมวลผลสำเร็จ");
                    // สร้าง info object จำลองเพื่อแสดงผลทันที
                    data.special = selectedComplications.length > 0 ? selectedComplications.join(", ") : "NoOtherComplication";
                    showResult(json, data);
                } else {
                    alert("Error: " + json.message);
                }
            } catch(e) { alert("Server Error"); }
        }

        async function searchPatient() {
            const id = document.getElementById('search_id').value;
            if(!id) return alert("ใส่ ID");
            try {
                const res = await fetch(`/api/patient/${id}`);
                const json = await res.json();
                if(json.status === 'error') return alert("ไม่พบข้อมูล");
                showResult(json, json.info);
            } catch(e) { alert("Server Error"); }
        }

        async function reprocessPatient() {
            const id = document.getElementById('search_id').value || document.getElementById('pid').value;
            if(!id) return;
            const res = await fetch(`/api/reprocess/${id}`, { method: 'POST' });
            const json = await res.json();
            if(json.status === 'ok') { alert("Done"); searchPatient(); }
        }

        async function deletePatient() {
            const id = document.getElementById('search_id').value;
            if(!id || !confirm("ลบ?")) return;
            await fetch(`/api/delete/${id}`, { method: 'DELETE' });
            alert("Deleted");
            document.getElementById('result').classList.add('d-none');
            document.getElementById('search_id').value = '';
        }

        function showResult(json, info) {
            document.getElementById('result').classList.remove('d-none');
            const v = (val) => val ? val : '-';
            document.getElementById('profileTableBody').innerHTML = `
                <tr><th>ชื่อ-สกุล</th><td>${v(info.firstname)} ${v(info.lastname)}</td></tr>
                <tr><th>Type / BMI</th><td>${v(info.type)} / ${v(info.bmi)}</td></tr>
                <tr><th>ความดัน</th><td>${v(info.sbp)} / ${v(info.dbp)}</td></tr>
                <tr><th>Lab (FPG)</th><td>${v(info.fpg)}</td></tr>
                <tr><th>Lab (Chol/LDL)</th><td>${v(info.chol)} / ${v(info.ldl)}</td></tr>
                <tr><th>Lab (HDL/Tri)</th><td>${v(info.hdl)} / ${v(info.tri)}</td></tr>
                <tr><th>Lab (Other)</th><td>K:${v(info.ketone)}, M:${v(info.micro)}</td></tr>
                <tr><th>Special Comp.</th><td class="text-danger">${v(info.special)}</td></tr>
            `;
            updateList('warnList', json.warnings);
            updateList('exList', json.exercises);
            updateList('comorbList', json.comorbs);
            updateList('compliList', json.complis);
        }

        function updateList(id, items) {
            const el = document.getElementById(id);
            el.innerHTML = (!items || !items.length) ? "<li class='list-group-item text-muted fst-italic'>- ไม่มี -</li>" : 
            items.map(x => `<li class="list-group-item"><i class="bi bi-caret-right-fill opacity-50"></i> ${x}</li>`).join('');
        }
    </script>
</body>
</html>
