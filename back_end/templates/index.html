<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes AI</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; max-width: 900px; margin: auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-weight: bold; font-size: 0.9em; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; margin-right: 5px; color: white; }
        .btn-green { background: #28a745; width: 100%; margin-top: 10px; }
        .btn-blue { background: #007bff; }
        .btn-orange { background: #ffc107; color: black; }
        .btn-red { background: #dc3545; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">🏥 ระบบผู้เชี่ยวชาญเบาหวาน</h2>

    <div class="card">
        <h3>📝 ข้อมูลผู้ป่วย</h3>
        <div class="form-grid">
            <div><label>ID:</label><input type="number" id="pid" placeholder="99"></div>
            <div><label>Type:</label><select id="dtype"><option value="T1DM">T1DM</option><option value="T2DM">T2DM</option></select></div>
            <div><label>ชื่อ:</label><input type="text" id="fname"></div>
            <div><label>สกุล:</label><input type="text" id="lname"></div>
        </div>
        <hr>
        <div class="form-grid">
            <div><label>BMI:</label><input type="number" step="0.1" id="bmi"></div>
            <div><label>SBP (บน):</label><input type="number" id="sbp"></div>
            <div><label>DBP (ล่าง):</label><input type="number" id="dbp"></div>
            <div><label>FPG (น้ำตาล):</label><input type="number" id="fpg"></div>
            <div><label>Cholesterol:</label><input type="number" id="chol"></div>
            <div><label>LDL:</label><input type="number" id="ldl"></div>
            <div><label>HDL:</label><input type="number" id="hdl"></div>
            <div><label>Triglyceride:</label><input type="number" id="tri"></div>
            <div><label>Ketone:</label>
                <select id="ketone">
                    <option value="Negative">Negative</option>
                    <option value="Positive">Positive</option>
                </select>
            </div>
            <div><label>Microalbuminurin:</label>
                <select id="micro">
                    <option value="Negative">Negative</option>
                    <option value="Positive">Positive</option>
                </select>
            </div>
            <div><label>ภาวะแทรกซ้อนพิเศษ:</label>
                <select id="special">
                    <option value="None">- ระบุ -</option>
                    <option value="NoOtherComplication">ไม่มีภาวะแทรกซ้อนอื่น (NoOther)</option>
                </select>
            </div>
        </div>
        <button class="btn-green" onclick="analyzeData()">🚀 บันทึก & ประมวลผล</button>
    </div>

    <div id="result" class="card" style="display:none; border-left: 5px solid #28a745;">
        <h3>ผลการวิเคราะห์</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <p><strong>⚠️ คำเตือน:</strong></p><ul id="warnList"></ul>
            </div>
            <div>
                <p><strong>🩺 ภาวะแทรกซ้อน:</strong></p><ul id="compliList" style="color:red;"></ul>
            </div>
        </div>
        <p><strong>✅ แนะนำออกกำลังกาย:</strong></p><ul id="exList"></ul>
        <p><strong>➕ โรคร่วม (Comorbidity):</strong></p><ul id="comorbList"></ul>
    </div>

    <div class="card" style="background: #e9ecef;">
        <h3>🔍 จัดการข้อมูล</h3>
        <input type="text" id="search_id" placeholder="ID" style="width: 100px;">
        <button class="btn-blue" onclick="searchPatient()">ค้นหา</button>
        <button class="btn-orange" onclick="reprocessPatient()">⚡ รันกฎใหม่</button>
        <button class="btn-red" onclick="deletePatient()">ลบ</button>
    </div>

    <script>
        async function analyzeData() {
            const data = {
                id: document.getElementById('pid').value,
                type: document.getElementById('dtype').value,
                firstname: document.getElementById('fname').value,
                lastname: document.getElementById('lname').value,
                bmi: document.getElementById('bmi').value,
                sbp: document.getElementById('sbp').value,
                dbp: document.getElementById('dbp').value,
                chol: document.getElementById('chol').value,
                ldl: document.getElementById('ldl').value,
                hdl: document.getElementById('hdl').value,
                tri: document.getElementById('tri').value,
                fpg: document.getElementById('fpg').value,
                ketone: document.getElementById('ketone').value,
                micro: document.getElementById('micro').value,
                special: document.getElementById('special').value // ✅ ส่งค่า special ไปด้วย
            };
            if(!data.id) return alert("ใส่ ID ก่อน");
            const res = await fetch('/api/analyze', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            const json = await res.json();
            showResult(json);
        }

        async function searchPatient() {
            const id = document.getElementById('search_id').value;
            if(!id) return;
            const res = await fetch(`/api/patient/${id}`);
            const json = await res.json();
            if(json.status === 'error') { alert("ไม่พบ"); return; }
            
            document.getElementById('result').style.display = 'block';
            updateList('warnList', json.warnings);
            updateList('exList', json.exercises);
            updateList('comorbList', json.comorbs);
            updateList('compliList', json.complis);
            
            // คืนค่าฟอร์ม (ถ้ามี)
            if(json.info.special) document.getElementById('special').value = json.info.special;
        }

        async function reprocessPatient() {
            const id = document.getElementById('search_id').value;
            if(!id) return;
            const res = await fetch(`/api/reprocess/${id}`, { method: 'POST' });
            const json = await res.json();
            if(json.status === 'ok') { alert("เสร็จสิ้น"); searchPatient(); }
        }

        async function deletePatient() {
            const id = document.getElementById('search_id').value;
            if(confirm("ลบ?")) await fetch(`/api/delete/${id}`, { method: 'DELETE' });
        }

        function showResult(json) {
            document.getElementById('result').style.display = 'block';
            updateList('warnList', json.warnings);
            updateList('exList', json.exercises);
            updateList('comorbList', json.comorbs);
            updateList('compliList', json.complis);
        }

        function updateList(id, items) {
            const el = document.getElementById(id); el.innerHTML = "";
            (items && items.length ? items : ["-"]).forEach(x => el.innerHTML += `<li>${x}</li>`);
        }
    </script>
</body>
</html>
