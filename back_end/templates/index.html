<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Expert System | ระบบผู้เชี่ยวชาญเบาหวาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00695c; --secondary: #4db6ac; --bg: #f0f4f8;
            --white: #ffffff; --text: #333; --danger: #d32f2f;
            --warning: #fbc02d; --success: #388e3c;
        }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 1000px; margin: auto; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 30px; font-weight: 600; }
        .card { background: var(--white); border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h3 { border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-top: 0; color: var(--primary); font-size: 1.1rem; }
        
        /* Grid Layout */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { margin-bottom: 5px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="number"], select { 
            width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; 
            font-family: 'Sarabun', sans-serif; box-sizing: border-box;
        }
        input:focus, select:focus { border-color: var(--secondary); outline: none; }

        /* Highlight BMI Field */
        #bmi { background-color: #e8f5e9; color: #2e7d32; font-weight: bold; pointer-events: none; }

        /* Checkbox Style */
        .checkbox-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #eee;
        }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
        .checkbox-item input { width: auto; margin: 0; cursor: pointer; }

        /* Buttons */
        .action-bar { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; color: white; transition: 0.2s; }
        .btn-main { background: var(--primary); width: 100%; }
        .btn-main:hover { background: #004d40; }
        .btn-blue { background: #1976d2; }
        .btn-orange { background: var(--warning); color: #333; }
        .btn-red { background: var(--danger); }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Result Section */
        #result { border-top: 5px solid var(--success); }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .result-box { background: #fafafa; padding: 15px; border-radius: 8px; border-left: 4px solid #ccc; }
        .box-warn { border-color: var(--warning); background: #fffde7; }
        .box-danger { border-color: var(--danger); background: #ffebee; }
        .box-success { border-color: var(--success); background: #e8f5e9; }
        ul { padding-left: 20px; margin: 5px 0; }
        li { margin-bottom: 5px; font-size: 0.95rem; }

        /* Search Bar */
        .search-area { display: flex; gap: 10px; align-items: center; background: #e3f2fd; padding: 15px; border-radius: 8px; }
        .search-area input { width: 120px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏥 ระบบผู้เชี่ยวชาญวินิจฉัยโรคเบาหวาน</h2>

        <div class="card">
            <h3>📝 ข้อมูลผู้ป่วย (Patient Info)</h3>
            <div class="form-grid">
                <div class="form-group"><label>ID (รหัส)</label><input type="number" id="pid" placeholder="เช่น 101"></div>
                <div class="form-group"><label>Type (ชนิด)</label><select id="dtype"><option value="T1DM">T1DM (ชนิดที่ 1)</option><option value="T2DM">T2DM (ชนิดที่ 2)</option></select></div>
                <div class="form-group"><label>ชื่อ</label><input type="text" id="fname"></div>
                <div class="form-group"><label>นามสกุล</label><input type="text" id="lname"></div>
            </div>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            
            <h3>🩺 ผลตรวจร่างกาย (Physical & Lab)</h3>
            <div class="form-grid">
                <div><label>น้ำหนัก (kg)</label><input type="number" id="weight" step="0.1" placeholder="เช่น 65"></div>
                <div><label>ส่วนสูง (cm)</label><input type="number" id="height" step="0.1" placeholder="เช่น 170"></div>
                
                <div><label>BMI (คำนวณอัตโนมัติ)</label><input type="number" id="bmi" placeholder="..." readonly></div>

                <div><label>FPG</label><input type="number" id="fpg" placeholder="100"></div>
                <div><label>SBP</label><input type="number" id="sbp" placeholder="120"></div>
                <div><label>DBP</label><input type="number" id="dbp" placeholder="80"></div>
                <div><label>Cholesterol</label><input type="number" id="chol" placeholder="150"></div>
                <div><label>LDL</label><input type="number" id="ldl" placeholder="100"></div>
                <div><label>HDL</label><input type="number" id="hdl" placeholder="50"></div>
                <div><label>Triglyceride</label><input type="number" id="tri" placeholder="100"></div>
                
                <div><label>Ketone</label>
                    <select id="ketone"><option value="Negative">Negative</option><option value="Positive">Positive</option></select>
                </div>
                <div><label>Microalbuminuria</label>
                    <select id="micro"><option value="Negative">Negative</option><option value="Positive">Positive</option></select>
                </div>

                <div style="grid-column: span 2;">
                    <label>⚠️ ภาวะแทรกซ้อนพิเศษ (เลือกได้หลายข้อ)</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item"><input type="checkbox" name="special" value="HeartDisease"> โรคหัวใจ (HeartDisease)</label>
                        <label class="checkbox-item"><input type="checkbox" name="special" value="PeripheralNeuropathy"> ปลายประสาทเสื่อม (PeripheralNeuropathy)</label>
                        <label class="checkbox-item"><input type="checkbox" name="special" value="AutonomicNeuropathy"> ระบบประสาทอัตโนมัติ (AutonomicNeuropathy)</label>
                        <label class="checkbox-item"><input type="checkbox" name="special" value="Retinopathy"> จอประสาทตาเสื่อม (Retinopathy)</label>
                        <label class="checkbox-item" style="color: green;"><input type="checkbox" name="special" value="NoOtherComplication" id="chkNoOther" onchange="toggleNoOther(this)"> ✅ ไม่มีภาวะแทรกซ้อนอื่น (NoOther)</label>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn-main" onclick="analyzeData()">🚀 บันทึก & ประมวลผล (Analyze)</button>
            </div>
        </div>

        <div id="result" class="card" style="display:none;">
            <h3 style="color:#2e7d32;">📊 ผลการวินิจฉัย</h3>
            <div class="result-grid">
                <div class="result-box box-warn"><p style="color:#f57f17; margin:0;"><strong>⚠️ คำเตือน</strong></p><ul id="warnList"></ul></div>
                <div class="result-box box-danger"><p style="color:#c62828; margin:0;"><strong>💉 ภาวะแทรกซ้อน</strong></p><ul id="compliList" style="color:#d32f2f;"></ul></div>
            </div>
            <div class="result-grid" style="margin-top: 15px;">
                <div class="result-box box-success"><p style="color:#2e7d32; margin:0;"><strong>🏃 แนะนำออกกำลังกาย</strong></p><ul id="exList"></ul></div>
                <div class="result-box"><p style="color:#1565c0; margin:0;"><strong>➕ โรคร่วม</strong></p><ul id="comorbList"></ul></div>
            </div>
        </div>

        <div class="search-area">
            <strong>🔍 จัดการข้อมูล:</strong>
            <input type="text" id="search_id" placeholder="ID ผู้ป่วย">
            <button class="btn-blue" onclick="searchPatient()">ค้นหา</button>
            <button class="btn-orange" onclick="reprocessPatient()">⚡ รันใหม่</button>
            <button class="btn-red" onclick="deletePatient()">ลบ</button>
        </div>
    </div>

    <script>
        // ✅ 1. ฟังก์ชันคำนวณ BMI Real-time
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const bmiInput = document.getElementById('bmi');

            if (weight > 0 && height > 0) {
                // สูตร: น้ำหนัก (kg) / (ส่วนสูง (m) ^ 2)
                const heightInMeters = height / 100;
                const bmi = weight / (heightInMeters * heightInMeters);
                bmiInput.value = bmi.toFixed(2); // ทศนิยม 2 ตำแหน่ง
            } else {
                bmiInput.value = '';
            }
        }

        // ✅ 2. ใส่ Event Listener ให้ทำงานทันทีที่พิมพ์
        document.getElementById('weight').addEventListener('input', calculateBMI);
        document.getElementById('height').addEventListener('input', calculateBMI);


        // --- ฟังก์ชันเดิม ---
        function toggleNoOther(checkbox) {
            if (checkbox.checked) {
                document.querySelectorAll('input[name="special"]:not(#chkNoOther)').forEach(el => el.checked = false);
            }
        }
        document.querySelectorAll('input[name="special"]:not(#chkNoOther)').forEach(el => {
            el.addEventListener('change', () => {
                if(el.checked) document.getElementById('chkNoOther').checked = false;
            });
        });

        async function analyzeData() {
            const selectedSpecials = Array.from(document.querySelectorAll('input[name="special"]:checked')).map(el => el.value);
            
            const data = {
                id: document.getElementById('pid').value,
                type: document.getElementById('dtype').value,
                firstname: document.getElementById('fname').value,
                lastname: document.getElementById('lname').value,
                
                // ✅ ส่งค่าน้ำหนัก ส่วนสูง ไปด้วย
                weight: document.getElementById('weight').value,
                height: document.getElementById('height').value,
                bmi: document.getElementById('bmi').value,

                sbp: document.getElementById('sbp').value,
                dbp: document.getElementById('dbp').value,
                chol: document.getElementById('chol').value,
                ldl: document.getElementById('ldl').value,
                hdl: document.getElementById('hdl').value,
                tri: document.getElementById('tri').value,
                fpg: document.getElementById('fpg').value,
                ketone: document.getElementById('ketone').value,
                micro: document.getElementById('micro').value,
                special: selectedSpecials
            };

            if(!data.id) return alert("กรุณาใส่ ID ผู้ป่วย");
            
            try {
                const res = await fetch('/api/analyze', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify(data) 
                });
                const json = await res.json();
                
                if(json.status === 'ok') {
                    showResult(json);
                    document.getElementById('search_id').value = data.id;
                    alert("✅ บันทึกและประมวลผลสำเร็จ!");
                } else {
                    alert("❌ Error: " + json.message);
                }
            } catch(e) { alert("เชื่อมต่อ Server ไม่ได้: " + e); }
        }

        async function searchPatient() {
            const id = document.getElementById('search_id').value;
            if(!id) return;
            const res = await fetch(`/api/patient/${id}`);
            const json = await res.json();
            if(json.status === 'error') { alert("ไม่พบข้อมูล"); return; }
            
            // คืนค่าฟอร์ม
            document.getElementById('pid').value = id;
            document.getElementById('fname').value = json.info.firstname;
            document.getElementById('lname').value = json.info.lastname;
            
            // ✅ คืนค่าน้ำหนัก ส่วนสูง BMI
            document.getElementById('weight').value = json.info.weight || '';
            document.getElementById('height').value = json.info.height || '';
            document.getElementById('bmi').value = json.info.bmi || '';

            // คืนค่า Lab อื่นๆ (ถ้าต้องการให้ครบต้องเพิ่ม id ให้ครบตาม field)
            document.getElementById('sbp').value = json.info.sbp || '';
            document.getElementById('dbp').value = json.info.dbp || '';
            
            document.querySelectorAll('input[name="special"]').forEach(el => el.checked = false);
            
            showResult(json);
        }

        async function reprocessPatient() {
            const id = document.getElementById('search_id').value;
            if(!id) return;
            const res = await fetch(`/api/reprocess/${id}`, { method: 'POST' });
            const json = await res.json();
            if(json.status === 'ok') { alert("เสร็จสิ้น"); searchPatient(); }
        }

        async function deletePatient() {
            const id = document.getElementById('search_id').value;
            if(confirm("ลบข้อมูล ID " + id + " ?")) {
                await fetch(`/api/delete/${id}`, { method: 'DELETE' });
                alert("ลบแล้ว");
                location.reload();
            }
        }

        function showResult(json) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').scrollIntoView({behavior: 'smooth'});
            updateList('warnList', json.warnings);
            updateList('exList', json.exercises);
            updateList('comorbList', json.comorbs);
            updateList('compliList', json.complis);
        }

        function updateList(id, items) {
            const el = document.getElementById(id); el.innerHTML = "";
            if(!items || items.length === 0) el.innerHTML = `<li style="color:#999;">- ไม่พบข้อมูล -</li>`;
            else items.forEach(x => el.innerHTML += `<li>${x}</li>`);
        }
    </script>
</body>
</html>
