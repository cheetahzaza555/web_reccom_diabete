<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiaBalance - ระบบแนะนำการออกกำลังกายสำหรับผู้ป่วยโรคเบาหวาน</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
        }
        
        /* สีหลักของแบรนด์ (อิงจากภาพ) */
        :root {
            --primary-blue: #325e9f; /* สีน้ำเงินเข้มตามปุ่ม */
            --light-blue: #4a7abf;
        }

        /* --- Navbar --- */
        .navbar-brand {
            font-weight: 700;
            color: var(--primary-blue) !important;
            font-size: 1.8rem;
        }
        .navbar-brand i {
            margin-right: 8px;
        }
        .btn-outline-primary {
            color: var(--primary-blue);
            border-color: var(--primary-blue);
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-outline-primary:hover {
            background-color: var(--primary-blue);
            color: white;
        }
        .btn-primary {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 20px;
        }
        .btn-primary:hover {
            background-color: var(--light-blue);
            border-color: var(--light-blue);
        }

        /* --- Hero Section --- */
        .hero-section {
            min-height: 85vh;
            display: flex;
            align-items: center;
        }
        .hero-title {
            font-weight: 700;
            font-size: 2.8rem;
            line-height: 1.3;
            margin-bottom: 20px;
        }
        .text-blue {
            color: var(--primary-blue);
        }
        .hero-subtitle {
            font-weight: 300;
            color: #6c757d;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 90%;
        }
        .btn-hero {
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
        }
        
        /* --- Hero Image --- */
        .hero-img-container {
            position: relative;
            text-align: center;
        }
        .hero-image {
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        /* Footer */
        .footer-tiny {
            color: #adb5bd;
            font-size: 0.8rem;
            text-align: center;
            padding: 20px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            .hero-section {
                padding-top: 40px;
                text-align: center;
            }
            .hero-subtitle {
                margin: 0 auto 30px auto;
            }
            .hero-img-container {
                margin-top: 40px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light py-3 border-bottom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="fa-solid fa-heart-pulse"></i> DiaBalance
            </a>
            
            <div class="d-flex gap-2">
                <a href="/login" class="btn btn-outline-primary px-4">เข้าสู่ระบบ</a>
                <a href="/register" class="btn btn-primary px-4">สมัครสมาชิก</a>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-lg-6 mb-5 mb-lg-0">
                    <h1 class="hero-title">
                        ระบบแนะนำการออกกำลังกายสำหรับ<br>ผู้ป่วยโรคเบาหวาน<br>
                        <span class="text-blue">ด้วยเทคโนโลยีเว็บแบบสื่อความหมาย</span>
                    </h1>
                    <p class="hero-subtitle">
                        ช่วยวิเคราะห์ข้อมูลสุขภาพ และสร้างแผนการออกกำลังกายที่เหมาะสมสำหรับคุณโดยเฉพาะ ด้วยเทคโนโลยีเว็บแบบสื่อความหมาย
                    </p>
                    <a href="/login" class="btn btn-primary btn-hero shadow-sm">
                        เข้าสู่ระบบเพื่อเริ่มต้นใช้งาน
                    </a>
                </div>

                <div class="col-lg-6">
                    <div class="hero-img-container">
                        <img src="{{ url_for('static', filename='images/landing_page/img01.png') }}" alt="Doctor consulting patient" class="hero-image" onerror="this.src='https://images.unsplash.com/photo-1576091160550-2173ff9e5ee5?q=80&w=1000&auto=format&fit=crop';">
                    </div>
                </div>

            </div>
        </div>
    </section>

    <div class="footer-tiny">
        &copy;2025 DiaBalance Project
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
</body>
</html>
