<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiaBalance - ระบบแนะนำการออกกำลังกายสำหรับผู้ป่วยโรคเบาหวาน</title>
    <meta name="description" content="DiaBalance เว็บแอปพลิเคชันแนะนำการออกกำลังกายสำหรับผู้ป่วยโรคเบาหวานด้วยเทคโนโลยีเว็บแบบสื่อความหมาย วิเคราะห์สุขภาพและสร้างแผนออกกำลังกายเฉพาะบุคคลอย่างปลอดภัย">
    <meta name="theme-color" content="#325e9f">
    <link rel="canonical" href="https://diabalance.tech/">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
        }
        
        /* สีหลักของแบรนด์ */
        :root {
            --primary-blue: #325e9f; /* สีน้ำเงินเข้มตามปุ่ม */
            --light-blue: #4a7abf;
        }

        /* --- Navbar --- */
        .navbar-brand {
            font-weight: 700;
            color: var(--primary-blue) !important;
            font-size: 1.8rem;
        }
        .navbar-brand svg {
            margin-right: 8px;
            vertical-align: -0.15em;
        }
        .btn-outline-primary {
            color: var(--primary-blue);
            border-color: var(--primary-blue);
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-outline-primary:hover {
            background-color: var(--primary-blue);
            color: #ffffff;
        }
        .btn-primary {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 20px;
        }
        .btn-primary:hover {
            background-color: var(--light-blue);
            border-color: var(--light-blue);
            color: #ffffff;
        }

        /* --- Hero Section --- */
        .hero-section {
            min-height: 85vh;
            display: flex;
            align-items: center;
        }
        .hero-title {
            font-weight: 700;
            font-size: 2.8rem;
            line-height: 1.3;
            margin-bottom: 20px;
        }
        .text-blue {
            color: var(--primary-blue);
        }
        .hero-subtitle {
            font-weight: 400;
            color: #4b5563; /* High contrast ratio for WCAG AAA */
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 90%;
        }
        .btn-hero {
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
        }
        
        /* --- Hero Image --- */
        .hero-img-container {
            position: relative;
            text-align: center;
        }
        .hero-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 600 / 576;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        /* Footer */
        .footer-tiny {
            color: #4b5563; /* Contrast ratio 7.3:1 (AAA) */
            font-size: 0.85rem;
            text-align: center;
            padding: 20px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            .hero-section {
                padding-top: 40px;
                text-align: center;
            }
            .hero-subtitle {
                margin: 0 auto 30px auto;
            }
            .hero-img-container {
                margin-top: 40px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light py-3 border-bottom">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <svg width="28" height="28" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true">
                        <path d="M228.3 469.1L47.6 300.4c-4.2-3.9-8.2-8.1-11.9-12.4l87 0c22.6 0 43-13.6 51.7-34.5l10.5-25.2 49.3 109.5c3.8 8.5 12.1 14 21.4 14.1s17.8-5 22-13.3L320 253.7l1.7 3.4c9.5 19 28.9 31 50.1 31l104.5 0c-3.7 4.3-7.7 8.5-11.9 12.4L283.7 469.1c-7.5 7-17.4 10.9-27.7 10.9s-20.2-3.9-27.7-10.9zM503.7 240l-132 0c-3 0-5.8-1.7-7.2-4.4l-23.2-46.3c-4.1-8.1-12.4-13.3-21.5-13.3s-17.4 5.1-21.5 13.3l-41.4 82.8L205.9 158.2c-3.9-8.7-12.7-14.3-22.2-14.1s-18.1 5.9-21.8 14.8l-31.8 76.3c-1.2 3-4.2 4.9-7.4 4.9L16 240c-2.6 0-5 .4-7.3 1.1C3 225.2 0 208.2 0 190.9l0-5.8c0-69.9 50.5-129.5 119.4-141C165 36.5 211.4 51.4 244 84l12 12 12-12c32.6-32.6 79-47.5 124.6-39.9C461.5 55.6 512 115.2 512 185.1l0 5.8c0 16.9-2.8 33.5-8.3 49.1z"/>
                    </svg>
                    DiaBalance
                </a>
                
                <div class="d-flex gap-2">
                    <a href="/login" class="btn btn-outline-primary px-4">เข้าสู่ระบบ</a>
                    <a href="/register" class="btn btn-primary px-4">สมัครสมาชิก</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-lg-6 mb-5 mb-lg-0">
                    <h1 class="hero-title">
                        ระบบแนะนำการออกกำลังกายสำหรับ<br>ผู้ป่วยโรคเบาหวาน<br>
                        <span class="text-blue">ด้วยเทคโนโลยีเว็บแบบสื่อความหมาย</span>
                    </h1>
                    <p class="hero-subtitle">
                        ช่วยวิเคราะห์ข้อมูลสุขภาพ และสร้างแผนการออกกำลังกายที่เหมาะสมสำหรับคุณโดยเฉพาะ ด้วยเทคโนโลยีเว็บแบบสื่อความหมาย
                    </p>
                    <a href="/login" class="btn btn-primary btn-hero shadow-sm">
                        เข้าสู่ระบบเพื่อเริ่มต้นใช้งาน
                    </a>
                </div>

                <div class="col-lg-6">
                    <div class="hero-img-container">
                        <picture>
                            <source srcset="{{ url_for('static', filename='images/landing_page/img01-600.webp') }}" type="image/webp">
                            <img src="{{ url_for('static', filename='images/landing_page/img01.png') }}" 
                                 alt="DiaBalance ระบบแนะนำการออกกำลังกายสำหรับผู้ป่วยโรคเบาหวาน" 
                                 class="hero-image"
                                 width="600"
                                 height="576"
                                 fetchpriority="high"
                                 onerror="this.src='https://images.unsplash.com/photo-1576091160550-2173ff9e5ee5?q=80&w=1000&auto=format&fit=crop';">
                        </picture>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="footer-tiny">
        &copy;2025 DiaBalance Project
    </footer>

</body>
</html>
