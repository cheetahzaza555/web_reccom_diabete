<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Diabetes Expert System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
        .bg-theme-dark {
            background-color: #345b95;
        }
        .btn-theme-light {
            background-color: #8aa6f8; 
            color: white;
        }
        .btn-theme-light:hover {
            background-color: #6d8ee6;
            color: white;
        }

        .input-group-text {
            background-color: white;
            border-right: none;
            color: #345b95;
        }
        .form-control {
            border-left: none;
        }

        .form-control:focus, .input-group-text {
            box-shadow: none;
            border-color: #ced4da;
        }
    </style>
</head>
<body class="bg-white d-flex align-items-center justify-content-center vh-100 position-relative">

    <div class="card border-0 shadow-lg bg-theme-dark text-white rounded-4" style="width: 100%; max-width: 700px; min-height: 700px;">
        <div class="card-body p-5 text-center d-flex flex-column h-100">
            
            <div class="mb-5 mt-3">
                <i class="fa-solid fa-door-open fa-5x"></i>
                <h2 class="fw-bold mt-4">เข้าสู่ระบบ</h2>
            </div>
            

            <form id="loginForm">
                <div class="input-group mb-3 ">
                    <span class="input-group-text rounded-start-pill ps-3">
                        <i class="fa-solid fa-envelope fa-xl"></i>
                    </span>
                    <input type="text" id="username" class="form-control form-control-lg rounded-end-pill py-2" placeholder="อีเมลหรือชื่อบัญชีผู้ใช้" required>
                </div>

                <div class="input-group mb-1">
                    <span class="input-group-text rounded-start-pill ps-3">
                        <i class="fa-solid fa-lock fa-xl"></i>
                    </span>
                    <input type="password" id="password" class="form-control form-control-lg rounded-end-pill py-2" placeholder="รหัสผ่าน" required>
                </div>

                <div class="text-end mb-3 mt-3">
                    <a href="/forget_password" class="text-white text-decoration-none small opacity-75 hover-opacity-100">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="btn btn-theme-light w-100 rounded-pill py-3 fw-bold fs-5 shadow-sm">
                    เข้าสู่ระบบ
                </button>
            </form>

            <div class="card-body  text-center d-flex flex-column"> 

                <div class="mt-auto text-white-50 pt-5 p-bottom-0">
                        ยังไม่มีบัญชีผู้ใช้? 
                    <a href="/register" class="text-white fw-bold text-decoration-underline">ลงทะเบียน</a>
                </div>
            </div>

        <div id="error" class="text-warning mt-3 small fw-bold"></div>
        </div>
    </div>

    <script>
        // 1. Logic การ Login
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error");
            
            // เปลี่ยนปุ่มเป็นสถานะกำลังโหลด (UX)
            const btn = document.querySelector("button[type='submit']");
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังเข้าสู่ระบบ...';
            btn.disabled = true;

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "เข้าสู่ระบบไม่สำเร็จ");
                }

                localStorage.setItem("token", data.token);
                const userRole = (data.role || "").toLowerCase(); 

                if (userRole === "admin") {
                    window.location.href = "/admin/dashboard"; // พาไปหลังบ้าน
                } else {
                    window.location.href = "/user/dashboard";  // พาไปหน้าผู้ใช้ปกติ
                }

            } catch (err) {
                errorDiv.innerText = err.message || "เชื่อมต่อ server ไม่ได้";
                // คืนค่าปุ่มกลับมา
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        });

    </script>
</body>
</html>
