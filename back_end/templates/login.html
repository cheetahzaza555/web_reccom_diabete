<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | DiaBalance - Diabetes Expert System</title>
    <meta name="description" content="เข้าสู่ระบบ DiaBalance ระบบแนะนำการออกกำลังกายและการดูแลสุขภาพสำหรับผู้ป่วยโรคเบาหวาน">
    <meta name="theme-color" content="#345b95">
    <link rel="canonical" href="https://diabalance.tech/login">
    
    <!-- Inline SVG Favicon to avoid 404 console errors -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23345b95'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">

    <!-- Preconnect origins for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Non-render-blocking Google Fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap">
    </noscript>

    <style>
        body {
            font-family: 'Prompt', system-ui, -apple-system, sans-serif;
            background-color: #f4f6fa;
        }
        .bg-theme-dark {
            background-color: #345b95;
        }
        .btn-theme-light {
            background-color: #8aa6f8; 
            color: #0b1f3a;
            font-weight: 700;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-theme-light:hover, .btn-theme-light:focus {
            background-color: #7294f5;
            color: #0b1f3a;
        }

        .input-group-text {
            background-color: #ffffff;
            border-right: none;
            color: #345b95;
            width: 48px;
            justify-content: center;
        }
        .form-control {
            border-left: none;
            color: #1e293b;
        }
        .form-control::placeholder {
            color: #64748b;
            opacity: 1;
        }

        .form-control:focus, .input-group-text {
            box-shadow: none;
            border-color: #ced4da;
        }

        .door-icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-white d-flex align-items-center justify-content-center min-vh-100 p-3 position-relative">

    <main class="card border-0 shadow-lg bg-theme-dark text-white rounded-4 my-auto" style="width: 100%; max-width: 580px;">
        <div class="card-body p-4 p-sm-5 text-center d-flex flex-column">
            
            <div class="mb-4 mt-2">
                <div class="door-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 576 512" fill="currentColor" aria-hidden="true">
                        <path d="M320 32c0-9.9-4.5-19.2-12.3-25.2S289.8-1.4 280.2 1l-179.9 45C79 51.3 64 69.9 64 91v325H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h288c17.7 0 32-14.3 32-32V32zm-64 256c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32zm288 160h-64V64c0-35.3-28.7-64-64-64H384c-17.7 0-32 14.3-32 32v448h192c17.7 0 32-14.3 32-32s-14.3-32-32-32z"/>
                    </svg>
                </div>
                <h1 class="fw-bold mt-3 fs-2 text-white">เข้าสู่ระบบ</h1>
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="visually-hidden">ชื่อบัญชีผู้ใช้</label>
                    <div class="input-group">
                        <span class="input-group-text rounded-start-pill ps-3" id="user-addon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 512 512" fill="#345b95" aria-hidden="true">
                                <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z"/>
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" class="form-control form-control-lg rounded-end-pill py-2" placeholder="ชื่อบัญชีผู้ใช้" autocomplete="username" required aria-label="ชื่อบัญชีผู้ใช้">
                    </div>
                </div>

                <div class="mb-2">
                    <label for="password" class="visually-hidden">รหัสผ่าน</label>
                    <div class="input-group">
                        <span class="input-group-text rounded-start-pill ps-3" id="pass-addon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 448 512" fill="#345b95" aria-hidden="true">
                                <path d="M144 144v48H304V144c0-44.2-35.8-80-80-80s-80 35.8-80 80zM80 192V144C80 64.5 144.5 0 224 0s144 64.5 144 144v48h16c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V256c0-35.3 28.7-64 64-64H80z"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="form-control form-control-lg rounded-end-pill py-2" placeholder="รหัสผ่าน" autocomplete="current-password" required aria-label="รหัสผ่าน">
                    </div>
                </div>

                <div class="text-end mb-4 mt-2">
                    <a href="/forget_password" class="text-white text-decoration-underline small">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="btn btn-theme-light w-100 rounded-pill py-3 fw-bold fs-5 shadow-sm">
                    เข้าสู่ระบบ
                </button>
            </form>

            <div class="mt-4 pt-3" style="color: #f1f5f9;"> 
                ยังไม่มีบัญชีผู้ใช้? 
                <a href="/register" class="text-white fw-bold text-decoration-underline ms-1">ลงทะเบียน</a>
            </div>

            <div id="error" class="text-warning mt-3 small fw-bold" role="alert" aria-live="polite"></div>
        </div>
    </main>

    <script>
        // 1. Logic การ Login
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error");
            errorDiv.innerText = "";
            
            // ตรวจสอบความถูกต้องเบื้องต้น
            if (!username || !password) {
                errorDiv.innerText = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";
                return;
            }

            // เปลี่ยนปุ่มเป็นสถานะกำลังโหลด (UX)
            const btn = document.querySelector("button[type='submit']");
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> กำลังเข้าสู่ระบบ...';
            btn.disabled = true;

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "เข้าสู่ระบบไม่สำเร็จ");
                }

                localStorage.setItem("token", data.token);
                const userRole = (data.role || "").toLowerCase(); 

                if (userRole === "admin") {
                    window.location.href = "/admin/dashboard"; // พาไปหลังบ้าน
                } else {
                    window.location.href = "/user/dashboard";  // พาไปหน้าผู้ใช้ปกติ
                }

            } catch (err) {
                errorDiv.innerText = err.message || "เชื่อมต่อ server ไม่ได้";
                // คืนค่าปุ่มกลับมา
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
