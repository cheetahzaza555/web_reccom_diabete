<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังท่าออกกำลังกาย - DiabBalance</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f0f2f5; }
        .page-header {
            background: linear-gradient(120deg, #4facfe 0%, #00f2fe 100%);
            color: white; padding: 60px 0 40px;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 40px;
        }
        .nav-pills .nav-link {
            background-color: white; color: #555; border-radius: 30px;
            padding: 10px 25px; margin: 0 5px; transition: all 0.3s;
            border: 1px solid #eee; white-space: nowrap;
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd; color: white;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
        .exercise-card {
            border: none; border-radius: 20px; background: white;
            overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s; height: 100%; cursor: pointer;
        }
        .exercise-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .card-img-wrapper { height: 200px; overflow: hidden; position: relative; background-color: #eee; }
        .card-img-top { width: 100%; height: 100%; object-fit: cover; }
        .mets-badge {
            position: absolute; top: 15px; right: 15px; padding: 5px 12px;
            border-radius: 15px; font-size: 0.85rem; font-weight: bold;
            color: white; backdrop-filter: blur(5px); z-index: 2;
        }
        .bg-low { background-color: rgba(40, 167, 69, 0.9); }
        .bg-med { background-color: rgba(255, 193, 7, 0.9); color: #333 !important; }
        .bg-high { background-color: rgba(220, 53, 69, 0.9); }
    </style>
</head>
<body>

    {% include 'includes/navbar_user.html' %}

    <header class="page-header text-center">
        <div class="container">
            <h1 class="fw-bold mb-3">คลังท่าออกกำลังกาย</h1>
            <p class="lead opacity-75">เลือกหมวดหมู่ที่เหมาะสมกับเป้าหมายสุขภาพของคุณ</p>
            <div class="row justify-content-center mt-4">
                <div class="col-md-6">
                    <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden">
                        <span class="input-group-text bg-white border-0 ps-4"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-0" placeholder="ค้นหาท่าออกกำลังกาย..." onkeyup="filterContent()">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <div class="d-flex justify-content-center mb-5 overflow-auto py-2">
            <ul class="nav nav-pills flex-nowrap" id="categoryTabs">
                <li class="nav-item"><button class="nav-link active" onclick="filterCategory('all')">ทั้งหมด</button></li>
                <li class="nav-item"><button class="nav-link" onclick="filterCategory('Aerobic')">แอโรบิก</button></li>
                <li class="nav-item"><button class="nav-link" onclick="filterCategory('Resistance')">แรงต้าน</button></li>
                <li class="nav-item"><button class="nav-link" onclick="filterCategory('Flexibility')">ความยืดหยุ่น</button></li>
            </ul>
        </div>
        <div class="row g-4" id="exerciseGrid">
            </div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 pb-0"><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body text-center pt-0 pb-4 px-4">
                    <img id="mImg" src="" class="rounded-3 mb-3 shadow-sm bg-light" style="width: 100%; height: 250px; object-fit: cover;">
                    <h3 id="mTitle" class="fw-bold mb-2">Title</h3>
                    <div class="d-inline-block px-3 py-1 rounded-pill bg-light text-muted fw-bold mb-3">
                        <i class="fas fa-fire me-1 text-danger"></i> METs: <span id="mMets">0</span>
                    </div>
                    <p id="mDesc" class="text-muted text-start"></p>
                </div>
            </div>
        </div>
    </div>

    <script id="exercises-data-source" type="application/json">
        {{ exercises | tojson | safe }}
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const placeholderImg = "data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22286%22%20height%3D%22180%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20286%20180%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23eee%22%3E%3C%2Frect%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%23999%22%20dy%3D%22.3em%22%20text-anchor%3D%22middle%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E";

    let exercisesData = [];
    try {
        const dataSource = document.getElementById('exercises-data-source');
        exercisesData = JSON.parse(dataSource.textContent || "[]");
    } catch (e) { console.error("Data Error:", e); }

    const grid = document.getElementById('exerciseGrid');
    let currentFilter = 'all';

    function renderCards(data) {
        grid.innerHTML = data.length ? "" : '<div class="col-12 text-center py-5"><h4>ไม่พบข้อมูล</h4></div>';
        
        data.forEach(item => {
            const mets = parseFloat(item.mets) || 0;
            const badgeColor = mets > 6 ? 'bg-high' : (mets > 3 ? 'bg-med' : 'bg-low');
            
            // ✅ ดึงรูปจาก item.img ที่ Backend (Python) เลือกมาให้แล้วได้เลย
            const imgUrl = item.img || placeholderImg;

            grid.innerHTML += `
            <div class="col-md-6 col-lg-4">
                <div class="exercise-card" onclick="openModal('${item.id}')">
                    <div class="card-img-wrapper">
                        <span class="mets-badge ${badgeColor}">METs ${mets}</span>
                        <img src="${imgUrl}" class="card-img-top" onerror="this.src='${placeholderImg}'">
                    </div>
                    <div class="card-body p-4">
                        <small class="text-primary text-uppercase">${item.type}</small>
                        <h5 class="fw-bold text-truncate">${item.name}</h5>
                        <p class="text-muted small text-truncate">${item.desc}</p>
                    </div>
                </div>
            </div>`;
        });
    }

    function filterCategory(cat) {
        currentFilter = cat;
        document.querySelectorAll('#categoryTabs .nav-link').forEach(btn => {
            const isAll = cat === 'all' && btn.innerText === 'ทั้งหมด';
            const isMatch = btn.innerText.includes(cat);
            btn.classList.toggle('active', isAll || isMatch);
        });
        filterContent();
    }

    function filterContent() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const filtered = exercisesData.filter(item => 
            (item.name.toLowerCase().includes(search)) && 
            (currentFilter === 'all' || item.type === currentFilter)
        );
        renderCards(filtered);
    }

    const myModal = new bootstrap.Modal(document.getElementById('detailModal'));
    function openModal(id) {
        const item = exercisesData.find(x => String(x.id) === String(id));
        if (item) {
            // ✅ ใช้ค่า item.img จาก Backend เช่นกัน
            document.getElementById('mImg').src = item.img || placeholderImg;
            document.getElementById('mTitle').innerText = item.name;
            document.getElementById('mDesc').innerText = item.desc;
            document.getElementById('mMets').innerText = item.mets;
            myModal.show();
        }
    }

    document.addEventListener('DOMContentLoaded', () => renderCards(exercisesData));
</script>
</body>
</html>
