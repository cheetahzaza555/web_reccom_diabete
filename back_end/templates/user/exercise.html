<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังท่าออกกำลังกาย - DiabBalance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f0f2f5; }
        .page-header {
            background: #85A2FF;
            color: white; padding: 60px 0 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 40px;
        }
        .filter-container {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-top: -30px;
            position: relative; z-index: 10;
        }
        .exercise-card {
            border: none; border-radius: 20px; background: white;
            overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s; height: 100%; cursor: pointer;
        }
        .exercise-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .card-img-wrapper { height: 200px; overflow: hidden; position: relative; background-color: #fff; }
        .card-img-top { width: 100%; height: 100%; object-fit: contain; padding: 15px; }
        
        .mets-badge {
            position: absolute; top: 15px; right: 15px; padding: 5px 12px;
            border-radius: 15px; font-size: 0.85rem; font-weight: bold;
            color: white; backdrop-filter: blur(5px); z-index: 2;
        }
        .type-badge {
            position: absolute; top: 15px; left: 15px; padding: 5px 12px;
            border-radius: 15px; font-size: 0.75rem; font-weight: bold;
            color: white; z-index: 2; background: rgba(0,0,0,0.5);
        }
        .bg-low { background-color: rgba(40, 167, 69, 0.9); }
        .bg-med { background-color: rgba(255, 193, 7, 0.9); color: #333 !important; }
        .bg-high { background-color: rgba(220, 53, 69, 0.9); }
    </style>
</head>
<body>

    {% include 'includes/navbar_user.html' %}

    <header class="page-header text-center">
        <div class="container">
            <h1 class="fw-bold mb-3">คลังท่าออกกำลังกาย</h1>
            <p class="lead opacity-75">ค้นหาท่าออกกำลังกายและเรียนรู้วิธีฝึกที่ถูกต้อง</p>
        </div>
    </header>

    <div class="container pb-5">
        <div class="row justify-content-center mb-4">
            <div class="col-md-10 col-lg-8">
                <div class="filter-container">
                    <div class="row g-3">
                        <div class="col-md-7">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="ค้นหาชื่อท่า..." onkeyup="filterContent()">
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-filter text-primary"></i></span>
                                <select id="ontologyDropdown" class="form-select border-start-0" onchange="filterCategory(this.value)"></select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4" id="exerciseGrid"></div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 pb-0"><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body text-center pt-0 pb-4 px-4">
                    <img id="mImg" src="" class="rounded-3 mb-3 shadow-sm bg-light" style="width: 100%; height: 250px; object-fit: contain; padding: 10px;">
                    <h3 id="mTitle" class="fw-bold mb-2"></h3>
                    <div class="d-flex justify-content-center gap-2 mb-4">
                        <div class="px-3 py-1 rounded-pill bg-light text-muted fw-bold">
                            <i class="fas fa-fire me-1 text-danger"></i> METs: <span id="mMets"></span>
                        </div>
                    </div>
                    
                    <div class="border-top pt-3">
                        <a id="goToDetail" href="#" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                            <i class="fas fa-arrow-right me-2"></i>เข้าสู่หน้าฝึกท่านี้
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script id="exercises-data-source" type="application/json">{{ exercises | tojson | safe }}</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const placeholderImg = "/static/images/exercises/exercise_default.png";
    let exercisesData = [];
    const grid = document.getElementById('exerciseGrid');
    let currentFilter = 'all';

    try {
        exercisesData = JSON.parse(document.getElementById('exercises-data-source').textContent || "[]");
    } catch (e) { console.error("Data Error:", e); }

    function translateType(type) {
        const dict = {
            "Walking": "การเดิน", "Running": "การวิ่ง", "Dancing": "การเต้น",
            "WeightBearingAerobicSport": "กีฬาแอโรบิกแบบลงน้ำหนัก", "Bicycling": "ปั่นจักรยาน",
            "WaterActivity": "กิจกรรมทางน้ำ", "NonWeightBearingAerobicSport": "กีฬาแอโรบิกแบบไม่ลงน้ำหนัก",
            "WeightBearingResistanceExercise": "แรงต้านแบบลงน้ำหนัก", "NonWeightBearingResistanceExercise": "แรงต้านแบบไม่ลงน้ำหนัก",
            "StretchingExercise": "การยืดเหยียด", "Aerobic": "แอโรบิก", "Resistance": "แรงต้าน"
        };
        return dict[type] || type;
    }

    function renderFilterDropdown() {
        const dropdown = document.getElementById('ontologyDropdown');
        const structure = {
            "Aerobic (แอโรบิก)": ["Walking", "Running", "Dancing", "WeightBearingAerobicSport", "Bicycling", "WaterActivity", "NonWeightBearingAerobicSport"],
            "Resistance (แรงต้าน)": ["WeightBearingResistanceExercise", "NonWeightBearingResistanceExercise"],
            "Stretching (ยืดเหยียด)": ["StretchingExercise"]
        };
        let html = `<option value="all">ทุกประเภท (แสดงทั้งหมด)</option>`;
        for (const [parent, children] of Object.entries(structure)) {
            html += `<optgroup label="─── ${parent} ───">`;
            children.forEach(child => {
                html += `<option value="${child}">&nbsp;&nbsp;• ${translateType(child)}</option>`;
            });
            html += `</optgroup>`;
        }
        dropdown.innerHTML = html;
    }

    function renderCards(data) {
        grid.innerHTML = data.length ? "" : '<div class="col-12 text-center py-5"><h4>ไม่พบข้อมูล</h4></div>';
        data.forEach(item => {
            const mets = parseFloat(item.mets) || 0;
            const badgeColor = mets > 6 ? 'bg-high' : (mets > 3 ? 'bg-med' : 'bg-low');
            
            const isTechnical = item.all_categories.some(cat => ["StretchingExercise", "Resistance", "WeightBearingResistanceExercise"].includes(cat));
            const typeLabel = isTechnical ? '<i class="fas fa-list-ol"></i> Step-by-Step' : '<i class="fas fa-lightbulb"></i> Tips & Safety';

            grid.innerHTML += `
            <div class="col-md-6 col-lg-4">
                <div class="exercise-card" onclick="openModal('${item.id}')">
                    <div class="card-img-wrapper">
                        <span class="type-badge">${typeLabel}</span>
                        <span class="mets-badge ${badgeColor}">METs ${mets}</span>
                        <img src="${item.img}" class="card-img-top" onerror="this.onerror=null;this.src='${placeholderImg}';">
                    </div>
                    <div class="card-body p-4"> 
                        <small class="text-primary fw-bold d-block mb-1">${translateType(item.original_type)}</small>
                        <h5 class="fw-bold mb-0 line-clamp-2" style="min-height: 3rem;">${item.name}</h5>
                    </div>
                </div>
            </div>`;
        });
    }

    function filterContent() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const filtered = exercisesData.filter(item => {
            const nameMatch = item.name.toLowerCase().includes(search);
            const catMatch = (currentFilter === 'all' || item.all_categories.includes(currentFilter));
            return nameMatch && catMatch;
        });
        renderCards(filtered);
    }

    function filterCategory(type) { currentFilter = type; filterContent(); }
    
    const myModal = new bootstrap.Modal(document.getElementById('detailModal'));
    
    function openModal(id) {
        const item = exercisesData.find(x => String(x.id) === String(id));
        if (item) {
            document.getElementById('mImg').src = item.img;
            document.getElementById('mTitle').innerText = item.name;
            document.getElementById('mMets').innerText = item.mets;
            document.getElementById('goToDetail').href = `/user/exercise-detail/${item.id}`;
            myModal.show();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderFilterDropdown();
        renderCards(exercisesData);
    });
    </script>
</body>
</html>
