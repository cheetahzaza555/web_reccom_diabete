<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก - DiaBalance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #ffffff;
        }

        .main-content {
            background-color: #ffffff;
            min-height: 100vh;
        }

        .header-banner {
            background-color: #85a2ff;
            color: white;
            padding: 40px 50px;
            font-size: 2.5rem;
            font-weight: 600;
        }

        .welcome-card {
            max-width: 900px;
            margin: 0 auto;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .welcome-icon {
            font-size: 5rem;
            color: #4f7cff;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 600;
            margin-top: 20px;
        }

        .welcome-desc {
            font-size: 1.1rem;
            color: #555;
            margin: 20px 0 35px;
        }

        .btn-start {
            background-color: #4f7cff;
            color: white;
            font-size: 1.2rem;
            padding: 15px 40px;
            border-radius: 12px;
            border: none;
        }

        .btn-start:hover {
            background-color: #3e66d6;
        }
    </style>
</head>
<body>

    <!-- คุณ include navbar เอง -->
    {% include 'includes/navbar_user.html' %}

    <div class="main-content d-flex flex-column">
        <!-- Header -->
        <div class="header-banner">
            หน้าหลัก
        </div>

        <!-- Content -->
        <div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
            <div class="welcome-card text-center bg-white">
                <div class="welcome-icon">
                    <i class="bi bi-clipboard2-pulse"></i>
                </div>

                <div class="welcome-title">
                    ยินดีต้อนรับเข้าสู่ DiaBalance
                </div>

                <div class="welcome-desc">
                    กรุณากรอกผลตรวจสุขภาพของคุณเพื่อให้ระบบสามารถวิเคราะห์
                    <br>
                    และแนะนำแผนการออกกำลังกายที่เหมาะสมสำหรับคุณ
                </div>

                <a href="/user/recommendations" class="btn btn-start">
                    <i class="bi bi-pencil-square me-2"></i>
                    เริ่มต้นใช้งาน
                </a>
            </div>
        </div>
    </div>

</body>
</html>
