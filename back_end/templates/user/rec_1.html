<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลตรวจสุขภาพ - DiaBalance</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Prompt', sans-serif;
            overflow-x: hidden;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header-banner {
            background-color: #85a2ff;
            color: white;
            padding: 30px 50px;
            font-size: 2.5rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .form-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .form-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
        }

        .form-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100%;
        }

        .form-scroll-area::-webkit-scrollbar {
            width: 8px;
        }

        .form-scroll-area::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .form-scroll-area::-webkit-scrollbar-thumb {
            background: #85a2ff;
            border-radius: 4px;
        }

        .form-scroll-area::-webkit-scrollbar-thumb:hover {
            background: #6d8ee6;
        }

        .button-area {
            background-color: #ffffff;
            padding: 20px 50px;
            border-top: 1px solid #dee2e6;
            flex-shrink: 0;
        }

        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: clamp(12px, 2vh, 20px) clamp(12px, 1.5vw, 18px);
            border: 1px solid #dee2e6;
            font-size: clamp(0.95rem, 1.5vw, 1.2rem);
            min-height: clamp(45px, 6vh, 65px);
        }

        .form-control:focus, .form-select:focus {
            border-color: #85a2ff;
            box-shadow: 0 0 0 0.2rem rgba(133, 162, 255, 0.25);
        }

        .form-select {
            background-size: clamp(16px, 2vw, 20px);
        }

        .btn-cancel {
            background-color: #b0b0b0;
            color: white;
            padding: 15px 0;
            border-radius: 10px;
            width: 100%;
            border: none;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-next {
            background-color: #85a2ff;
            color: white;
            padding: 15px 0;
            border-radius: 10px;
            width: 100%;
            border: none;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-next:hover {
            background-color: #6d8ee6;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(133, 162, 255, 0.3);
        }

        .btn-cancel:hover {
            background-color: #909090;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(176, 176, 176, 0.3);
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header-banner {
                padding: 20px 20px;
                font-size: 1.8rem;
            }

            .form-scroll-area {
                padding: 20px;
            }

            .button-area {
                padding: 15px 20px;
            }

            .btn-next, .btn-cancel {
                font-size: 1rem;
                padding: 12px 0;
            }

            .form-content {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    {% include 'includes/navbar_user.html' %}

    <div class="main-content">
        <!-- Header -->
        <div class="header-banner">
            ผลตรวจสุขภาพ
        </div>

        <!-- Form Wrapper -->
        <div class="form-wrapper">
            <form id="healthForm" action="/user/save_health_data" method="POST" class="h-100 d-flex flex-column">
                
                <!-- Scrollable Form Area -->
                <div class="form-scroll-area">
                    <div class="form-content">
                        <div class="row gy-4">
                            <!-- Left Column -->
                            <div class="col-lg-6">
                                <div class="form-section">
                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ผลการวินิจฉัยเบาหวาน</label>
                                            <select class="form-select" name="diabetes_type" required>
                                                <option value="" disabled selected>เลือกประเภท</option>
                                                <option value="1">โรคเบาหวานชนิดที่ 1</option>
                                                <option value="2">โรคเบาหวานชนิดที่ 2</option>
                                            </select>
                                        </div>
                                        
                                        <div class="col-6 mb-3">
                                            <label class="form-label">การฉีดอินซูลิน</label>
                                            <select class="form-select" name="insulin_use" required>
                                                <option value="" disabled selected>เลือก</option>
                                                <option value="yes">ใช้อินซูลิน</option>
                                                <option value="no">ไม่ใช้อินซูลิน</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">วันที่ได้รับการตรวจสุขภาพ</label>
                                        <input type="date" class="form-control" name="checkup_date" required>
                                    </div>

                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <label class="form-label">น้ำหนัก (กิโลกรัม)</label>
                                            <input type="number" class="form-control" id="weight" name="weight" step="0.1" min="1" required>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ส่วนสูง (เซนติเมตร)</label>
                                            <input type="number" class="form-control" id="height" name="height" step="0.1" min="1" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">ค่า BMI (คำนวณอัตโนมัติ)</label>
                                        <input type="text" class="form-control bg-light" id="bmi_result" name="bmi" readonly placeholder="จะปรากฏเมื่อกรอกน้ำหนักและส่วนสูง">
                                    </div>

                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ความดันโลหิตตัวบน (mmHg)</label>
                                            <input type="number" class="form-control" name="bp_high" min="50" max="250" required>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ความดันโลหิตตัวล่าง (mmHg)</label>
                                            <input type="number" class="form-control" name="bp_low" min="30" max="150" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column -->
                            <div class="col-lg-6">
                                <div class="form-section">
                                    <div class="mb-3">
                                        <label class="form-label">วันที่ได้รับการตรวจเลือด</label>
                                        <input type="date" class="form-control" name="blood_test_date" required>
                                    </div>

                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ระดับไขมัน HDL (mg/dL)</label>
                                            <input type="number" class="form-control" name="hdl" min="0" step="0.1" required>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ระดับไขมัน LDL (mg/dL)</label>
                                            <input type="number" class="form-control" name="ldl" min="0" step="0.1" required>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <label class="form-label">คอเลสเตอรอล (mg/dL)</label>
                                            <input type="number" class="form-control" name="cholesterol" min="0" step="0.1" required>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ไตรกลีเซอไรด์ (mg/dL)</label>
                                            <input type="number" class="form-control" name="triglyceride" min="0" step="0.1" required>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-6 mb-3">
                                            <label class="form-label">Microalbuminuria</label>
                                            <select class="form-select" name="microalbumin" required>
                                                <option value="" disabled selected>เลือก</option>
                                                <option value="positive">Positive</option>
                                                <option value="negative">Negative</option>
                                            </select>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <label class="form-label">ระดับคีโตน (Ketone)</label>
                                            <select class="form-select" name="ketone" required>
                                                <option value="" disabled selected>เลือก</option>
                                                <option value="positive">Positive</option>
                                                <option value="negative">Negative</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">ระดับน้ำตาลในเลือด (FPG) mg/dL</label>
                                        <input type="number" class="form-control" name="fpg" min="0" step="0.1" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Fixed Button Area -->
                <div class="button-area">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <button type="button" class="btn-cancel" onclick="window.history.back()">ยกเลิก</button>
                        </div>
                        <div class="col-md-6">
                            <button type="submit" class="btn-next">ถัดไป</button>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // BMI Calculation
        const weightInput = document.getElementById('weight');
        const heightInput = document.getElementById('height');
        const bmiOutput = document.getElementById('bmi_result');

        function calculateBMI() {
            const weight = parseFloat(weightInput.value);
            const height = parseFloat(heightInput.value) / 100;

            if (weight > 0 && height > 0) {
                const bmi = (weight / (height * height)).toFixed(2);
                bmiOutput.value = bmi;
                
                // Add BMI interpretation
                let interpretation = '';
                if (bmi < 18.5) interpretation = ' (ผอม)';
                else if (bmi < 23) interpretation = ' (ปกติ)';
                else if (bmi < 25) interpretation = ' (น้ำหนักเกิน)';
                else if (bmi < 30) interpretation = ' (อ้วน)';
                else interpretation = ' (อ้วนมาก)';
                
                bmiOutput.value = bmi + interpretation;
            } else {
                bmiOutput.value = "";
            }
        }

        weightInput.addEventListener('input', calculateBMI);
        heightInput.addEventListener('input', calculateBMI);

        // Form validation
        document.getElementById('healthForm').addEventListener('submit', function(e) {
            const bmiValue = document.getElementById('bmi_result').value;
            if (!bmiValue) {
                e.preventDefault();
                alert('กรุณากรอกน้ำหนักและส่วนสูงเพื่อคำนวณ BMI');
            }
        });
    </script>
</body>
</html>
